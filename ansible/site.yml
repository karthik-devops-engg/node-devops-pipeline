- name: Base setup for all servers
  hosts: all
  become: true
  roles:
    - common
    - node_exporter

- name: Deploy the application
  hosts: role_app
  become: true
  roles:
    - app

- name: Set up monitoring stack
  hosts: role_monitoring
  become: true
  roles:
    - monitoring

- name: Set up centralised logging (ELK)
  hosts: role_monitoring
  become: true
  roles:
    - logging

- name: Ship logs from app servers
  hosts: role_app
  become: true
  roles:
    - filebeat
