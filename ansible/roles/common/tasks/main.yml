- name: Install base packages and Docker
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - docker.io
      - docker-compose-v2
      - python3-docker
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure Docker is running and starts on boot
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Allow ubuntu user to run Docker
  ansible.builtin.user:
    name: ubuntu
    groups: docker
    append: true
